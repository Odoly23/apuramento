{% extends "base.html" %}{% load ui %}
{% block title %}2FA{% endblock %}
{% block topbar %}<h1>🔐 {% t 'twofa' %}</h1>{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <p>{% t 'twofa_scan' %}</p>
  <div style="text-align:center"><img src="{{ qr }}" alt="QR 2FA" width="220" height="220" style="border-radius:14px;background:#fff;padding:6px"></div>
  <p class="muted small" style="margin-top:12px">{% t 'twofa_manual' %}</p>
  <p class="mono" style="font-size:1.05rem;letter-spacing:.08em;word-break:break-all"><b>{{ secret }}</b></p>
  <form method="post">{% csrf_token %}
    <div class="field"><label for="code">{% t 'twofa_code' %}</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus
             style="font-size:1.6rem;letter-spacing:.3em;text-align:center"></div>
    <button class="btn primary" type="submit">{% t 'twofa_confirm' %}</button>
  </form>
</div>
{% endblock %}
