{% extends "base.html" %}{% load ui %}
{% block title %}2FA{% endblock %}
{% block topbar %}<h1>🔐 {% t 'twofa' %}</h1>{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:8vh auto 0">
  <p class="muted">{% t 'twofa_verify_help' %}</p>
  <form method="post">{% csrf_token %}
    <div class="field"><input name="code" autocomplete="one-time-code" maxlength="20" required autofocus
         style="font-size:1.5rem;letter-spacing:.2em;text-align:center" aria-label="{% t 'twofa_code' %}"></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center">{% t 'twofa_verify_btn' %}</button>
  </form>
</div>
{% endblock %}
